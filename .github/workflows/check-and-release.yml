name: Check and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: dotnet build src/TradingWorkbench -c Release
      - run: dotnet src/TradingWorkbench/bin/Release/net10.0/TradingWorkbench.dll --self-test
      - run: node --test tests/*.test.mjs

  arm64-image:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Read release metadata
        id: release
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          VERSION=$(sed -n 's/^version: "\(.*\)"$/\1/p' trading_workbench/config.yaml)
          test -n "$VERSION"
          IMAGE="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [[ "$REF" == refs/tags/* ]]; then
            test "$REF" = "refs/tags/v$VERSION"
            CONFIG_IMAGE=$(sed -n 's/^image: //p' trading_workbench/config.yaml)
            test "$CONFIG_IMAGE" = "$IMAGE"
          fi
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Check the ARM64 runtime before publication
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: docker run --rm --entrypoint dotnet "$IMAGE:$VERSION" /app/TradingWorkbench.dll --self-test
      - name: Check the bundled Codex auth transport without credentials
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: docker run --rm --entrypoint dotnet "$IMAGE:$VERSION" /app/TradingWorkbench.dll --codex-probe
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: docker push "$IMAGE:$VERSION"
